name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:e2e

      - run: pnpm exec playwright install --with-deps chromium webkit firefox
      - run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Vercel's own Git deploys are off (vercel.json); CI deploys with a token from the personal
  # Vercel account instead.
  deploy:
    needs: ci
    # Pull requests from forks get no secrets, so only deploy branches of this repo.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ github.event_name == 'push' && 'https://generation-feed.vercel.app' || steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # The personal account's team and the generation-feed project, by id (ids, not secrets): the
      # CLI reads them directly instead of looking up the token's user and teams.
      VERCEL_ORG_ID: team_lq3gUvlSi2tEgK5WkV3YK6Y2
      VERCEL_PROJECT_ID: prj_Jd0gUxapWr57xVMn1LMQAAbiUBx2
      VERCEL_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      PROD_FLAG: ${{ github.event_name == 'push' && '--prod' || '' }}
    steps:
      - name: Check the Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add the VERCEL_TOKEN repository secret (see README, Deploys)."
            exit 1
          fi

      # A pull request's own last commit, not the merge commit GitHub makes for it: Vercel
      # blocks a commit whose author it can't match to a GitHub account, and GitHub's merge
      # commits carry the account's private noreply address.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: npm install --global vercel@63.1.2

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment="$VERCEL_ENV" --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build $PROD_FLAG --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          # One archive instead of one upload per file: Vercel takes at most 15,000 files per
          # deploy, and the 1,100 static detail pages and their prefetch files pass that.
          url=$(vercel deploy --prebuilt --archive=tgz $PROD_FLAG --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $VERCEL_ENV: $url" >> "$GITHUB_STEP_SUMMARY"

  # Lighthouse CI on production after each deploy: the budgets are in lighthouserc.json
  # (docs/PERF.md). A broken budget turns the run red; LCP and TBT only warn until M7's
  # performance pass brings them under 2.5 s and 200 ms.
  lighthouse:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: pnpm lighthouse

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          retention-days: 14

